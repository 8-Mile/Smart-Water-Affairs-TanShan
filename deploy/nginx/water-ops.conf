# 生产运维管理系统 — Nginx 站点配置
# 安装位置：/etc/nginx/conf.d/water-ops.conf（conf.d 在 http 上下文中加载，map 指令合法）
# 说明：本配置不带 default_server —— Ubuntu 由 deploy.sh 删除 sites-enabled/default 后本站是唯一站点；
#       CentOS/RHEL 的 conf.d 先于 nginx.conf 内置 server 加载，本站自然成为默认站点，两种发行版都不冲突。

# WebSocket 升级头映射（/api/v1/ws/*：告警推送、站内消息）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;   # 内网直接用 IP 访问；有域名时改为域名并另行配置 HTTPS

    root /opt/water-ops/frontend/dist;
    index index.html;

    # 与后端 UPLOAD_MAX_MB=50 对齐（档案上传）
    client_max_body_size 50m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API + WebSocket 反代到 backend（backend 是唯一对外服务；
    # scada-gateway :8100 与 ai-service :8200 仅监听 127.0.0.1，不经 Nginx 暴露）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 问答/建档索引耗时长（AI_TIMEOUT_SEC=120），读写超时留足余量
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Vite 构建产物（文件名带内容 hash）：长缓存 + immutable
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Vue history 路由回退：前端路由路径一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
