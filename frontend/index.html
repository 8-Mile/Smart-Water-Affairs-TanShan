<!doctype html>
<html lang="zh-CN" data-box-mode="border-mode">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230e7ff0'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M32 13c-7.6 10.4-15 18.8-15 26.2A15 15 0 0 0 47 39.2C47 31.8 39.6 23.4 32 13z' fill='%23ffffff' fill-opacity='0.94'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>生产运维管理系统</title>
    <style>
      html {
        background-color: #f3f7fb;
      }
      html.dark {
        background-color: #070707;
      }
      /* 首屏加载：浅色科技风，纯 CSS 粒子/光环/光流，Vue 挂载后自动替换 */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(120% 90% at 50% 18%, #ffffff 0%, #f3f9fe 46%, #e9f2fa 100%);
        font-family:
          system-ui,
          -apple-system,
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
        overflow: hidden;
      }
      #boot-splash::before {
        content: '';
        position: absolute;
        inset: -10%;
        background-image:
          linear-gradient(rgba(31, 130, 190, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(31, 130, 190, 0.055) 1px, transparent 1px);
        background-size: 46px 46px;
        -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 68%);
        mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 68%);
        animation: bs-grid-drift 18s linear infinite;
        pointer-events: none;
      }
      html.dark #boot-splash {
        background: radial-gradient(120% 90% at 50% 18%, #122233 0%, #0b1622 60%, #08111a 100%);
      }
      #boot-splash .bs-stage {
        position: relative;
        width: 248px;
        height: 248px;
        display: grid;
        place-items: center;
      }
      #boot-splash .bs-ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(23, 137, 195, 0.18);
        animation: bs-spin linear infinite;
      }
      #boot-splash .bs-ring i {
        position: absolute;
        top: -3.5px;
        left: 50%;
        width: 7px;
        height: 7px;
        margin-left: -3.5px;
        border-radius: 50%;
        background: #28a7dd;
        box-shadow:
          0 0 10px rgba(40, 167, 221, 0.8),
          0 0 22px rgba(40, 167, 221, 0.35);
      }
      #boot-splash .bs-ring.r1 {
        width: 132px;
        height: 132px;
        animation-duration: 7s;
      }
      #boot-splash .bs-ring.r2 {
        width: 186px;
        height: 186px;
        border-color: rgba(23, 137, 195, 0.13);
        animation-duration: 12s;
        animation-direction: reverse;
      }
      #boot-splash .bs-ring.r2 i {
        top: auto;
        bottom: -3px;
        width: 5px;
        height: 5px;
        margin-left: -2.5px;
        background: #6cc6e8;
      }
      #boot-splash .bs-ring.r3 {
        width: 238px;
        height: 238px;
        border-color: rgba(23, 137, 195, 0.09);
        animation-duration: 20s;
      }
      #boot-splash .bs-ring.r3 i {
        top: 50%;
        left: -3px;
        margin-left: 0;
        margin-top: -3px;
        width: 6px;
        height: 6px;
        background: #9fd6ef;
      }
      #boot-splash .bs-beam {
        position: absolute;
        width: 186px;
        height: 186px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, rgba(14, 127, 240, 0) 0deg 258deg, rgba(38, 166, 219, 0.35) 320deg, rgba(14, 127, 240, 0) 360deg);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
        animation: bs-spin 3.4s linear infinite;
      }
      #boot-splash .bs-core {
        position: relative;
        display: grid;
        place-items: center;
        width: 86px;
        height: 86px;
        border-radius: 50%;
        background: radial-gradient(circle at 38% 30%, #ffffff 0%, #eaf6fd 55%, #d9ecf9 100%);
        border: 1px solid rgba(150, 205, 230, 0.7);
        box-shadow:
          0 10px 28px rgba(33, 92, 128, 0.16),
          inset 0 1px 0 #ffffff,
          0 0 0 10px rgba(255, 255, 255, 0.45),
          0 0 42px rgba(58, 160, 210, 0.22);
        animation: bs-breathe 3.2s ease-in-out infinite;
      }
      #boot-splash .bs-core svg {
        width: 38px;
        height: 38px;
      }
      #boot-splash .bs-particles {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #boot-splash .bs-particles i {
        position: absolute;
        bottom: 18%;
        left: var(--x, 50%);
        width: var(--s, 3px);
        height: var(--s, 3px);
        border-radius: 50%;
        background: rgba(38, 150, 200, 0.55);
        box-shadow: 0 0 8px rgba(38, 150, 200, 0.4);
        animation: bs-float var(--t, 7s) linear infinite;
        animation-delay: var(--d, 0s);
        opacity: 0;
      }
      #boot-splash .bs-title {
        margin: 14px 0 0;
        font-size: 16px;
        font-weight: 650;
        letter-spacing: 6px;
        color: #2b5a72;
        text-indent: 6px;
      }
      #boot-splash .bs-label {
        margin: 9px 0 0;
        font-size: 12px;
        letter-spacing: 3px;
        color: #7c98aa;
      }
      #boot-splash .bs-progress {
        position: relative;
        width: 208px;
        height: 3px;
        margin-top: 16px;
        overflow: hidden;
        border-radius: 3px;
        background: rgba(43, 122, 163, 0.14);
      }
      #boot-splash .bs-progress span {
        position: absolute;
        top: 0;
        left: 0;
        width: 42%;
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, rgba(14, 127, 240, 0), #1c9fd6 55%, rgba(14, 127, 240, 0));
        animation: bs-sweep 1.6s cubic-bezier(0.45, 0, 0.25, 1) infinite;
      }
      #boot-splash .bs-foot {
        margin: 20px 0 0;
        font-size: 10px;
        letter-spacing: 3px;
        color: #9db2c1;
      }
      #boot-splash .bs-dots {
        display: inline-block;
        width: 18px;
        text-align: left;
        overflow: hidden;
        vertical-align: bottom;
        animation: bs-dots 2.4s steps(4, end) infinite;
      }
      html.dark #boot-splash .bs-title {
        color: #d7e6f2;
      }
      html.dark #boot-splash .bs-label,
      html.dark #boot-splash .bs-foot {
        color: #8ba3bf;
      }
      html.dark #boot-splash .bs-core {
        background: radial-gradient(circle at 38% 30%, #1c3145 0%, #132433 60%, #0e1c29 100%);
        border-color: rgba(78, 146, 180, 0.4);
      }
      @keyframes bs-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes bs-breathe {
        0%,
        100% {
          box-shadow:
            0 10px 28px rgba(33, 92, 128, 0.16),
            inset 0 1px 0 #ffffff,
            0 0 0 10px rgba(255, 255, 255, 0.45),
            0 0 34px rgba(58, 160, 210, 0.18);
        }
        50% {
          box-shadow:
            0 10px 28px rgba(33, 92, 128, 0.18),
            inset 0 1px 0 #ffffff,
            0 0 0 14px rgba(255, 255, 255, 0.28),
            0 0 52px rgba(58, 160, 210, 0.3);
        }
      }
      @keyframes bs-sweep {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(340%);
        }
      }
      @keyframes bs-float {
        0% {
          transform: translate3d(0, 0, 0) scale(0.6);
          opacity: 0;
        }
        18% {
          opacity: 0.85;
        }
        100% {
          transform: translate3d(14px, -150px, 0) scale(1.1);
          opacity: 0;
        }
      }
      @keyframes bs-grid-drift {
        to {
          transform: translate3d(46px, 46px, 0);
        }
      }
      @keyframes bs-dots {
        0% {
          width: 0;
        }
        100% {
          width: 18px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .bs-ring,
        #boot-splash .bs-beam,
        #boot-splash .bs-core,
        #boot-splash .bs-particles i,
        #boot-splash .bs-progress span,
        #boot-splash::before,
        #boot-splash .bs-dots {
          animation: none;
        }
      }
    </style>
    <script>
      ;(function () {
        try {
          if (typeof Storage !== 'undefined' && window.localStorage) {
            if (localStorage.getItem('sys-theme') === 'dark') {
              document.documentElement.classList.add('dark')
            }
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app">
      <!-- 首屏加载：浅色科技风粒子光环，Vue 挂载后自动替换移除 -->
      <div id="boot-splash" role="status" aria-live="polite">
        <div class="bs-stage" aria-hidden="true">
          <span class="bs-ring r1"><i></i></span>
          <span class="bs-ring r2"><i></i></span>
          <span class="bs-ring r3"><i></i></span>
          <span class="bs-beam"></span>
          <span class="bs-core">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <defs>
                <linearGradient id="bsDrop" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#0e7ff0" />
                  <stop offset="1" stop-color="#06b6d4" />
                </linearGradient>
              </defs>
              <path d="M32 8c-8.4 11.6-16.6 21-16.6 29.3A16.6 16.6 0 0 0 48.6 37.3C48.6 29 40.4 19.6 32 8z" fill="url(#bsDrop)" />
              <path d="M24.6 39.2c0 4.4 3.4 7.6 7.6 7.9" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2.4" stroke-linecap="round" />
            </svg>
          </span>
          <span class="bs-particles">
            <i style="--x: 18%; --d: 0s; --t: 6.4s; --s: 3px"></i>
            <i style="--x: 32%; --d: 1.1s; --t: 7.6s; --s: 2px"></i>
            <i style="--x: 46%; --d: 2.3s; --t: 6.8s; --s: 4px"></i>
            <i style="--x: 58%; --d: 0.6s; --t: 8.2s; --s: 2px"></i>
            <i style="--x: 70%; --d: 1.8s; --t: 7.2s; --s: 3px"></i>
            <i style="--x: 82%; --d: 3s; --t: 6.6s; --s: 2px"></i>
            <i style="--x: 26%; --d: 3.6s; --t: 8.6s; --s: 2px"></i>
            <i style="--x: 64%; --d: 4.4s; --t: 7.8s; --s: 3px"></i>
          </span>
        </div>
        <p class="bs-title">唐港智慧水务系统</p>
        <p class="bs-label">数字孪生场景加载中<span class="bs-dots" aria-hidden="true">...</span></p>
        <div class="bs-progress" aria-hidden="true"><span></span></div>
        <p class="bs-foot">港口环境水务 · 监测 · 调度 · 回用 · 运营</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <!-- model-viewer 已改为本地 npm 依赖（内网离线环境，不再走 jsdelivr CDN），在 AiFloatAssistant 中按需引入 -->
  </body>
</html>
